[package]
name = "verge-probe"
edition = "2024"
license = "Apache-2.0"
version = "0.1.0"
description = "Host library for MCU-Link probes running Verge firmware"

[dependencies]
dirs = "7.0.0"
hex = "0.4.3"
hidapi = "2.6.7"
humantime = "2.4.0"
minisign = { version = "0.10.0", optional = true }
minisign-verify = "0.3.0"
nusb = "0.2.9"
object = { version = "0.40.0", default-features = false, features = ["read_core", "elf", "std"] }
probe-rs = { version = "0.32.0", git = "https://github.com/CordlessCoder/probe-rs", rev = "a0b3e56ab", default-features = false, features = ["builtin-targets", "builtin-formats", "coredump", "cmsisdap_v1"] }
rblhost = "0.2.0"
semver = "1.0.28"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
srec = "0.2.0"
tempfile = "3.27.0"
thiserror = "2.0.21"
tracing = "0.1.44"
ureq = "3.5.0"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
enum_glob_use = "deny"

[features]
simulate = ["dep:minisign"]

[dev-dependencies]
clap = { version = "4.6.7", features = ["derive"] }
verge-probe = { path = ".", features = ["simulate"] }
