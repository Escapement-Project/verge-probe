[package]
name = "verge-probe"
edition = "2024"
license = "Apache-2.0"
version = "0.1.0"
description = "Host library for MCU-Link probes running Verge firmware"

[dependencies]
csv = "1.4.0"
dirs = "7.0.0"
hex = "0.4.3"
hidapi = "2.6.7"
humantime = "2.4.0"
minisign = { version = "0.10.0", optional = true }
minisign-verify = "0.3.0"
nusb = "0.2.9"
object = { version = "0.40.0", default-features = false, features = ["read_core", "elf", "std"] }
postcard = { version = "1.1.3", default-features = false, features = ["use-std"], optional = true }
probe-rs = { version = "0.32.0", git = "https://github.com/CordlessCoder/probe-rs", rev = "17beb8e80", default-features = false, features = ["builtin-targets", "builtin-formats", "coredump"] }
rblhost = "0.2.0"
rusqlite = { version = "0.41.1", features = ["bundled"], optional = true }
same-file = "1.0.6"
semver = "1.0.28"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
srec = "0.2.0"
tempfile = "3.27.0"
thiserror = "2.0.21"
tracing = "0.1.44"
ureq = "3.5.1"
zip = { version = "9.3.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
enum_glob_use = "deny"

[features]
# Disk-backed energy captures (`capture`), on SQLite.
capture = ["dep:postcard", "dep:rusqlite"]
simulate = ["dep:minisign"]

[dev-dependencies]
clap = { version = "4.6.7", features = ["derive"] }
verge-probe = { path = ".", features = ["simulate"] }
