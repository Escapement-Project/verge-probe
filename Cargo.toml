[package]
name = "escapement-verge-probe"
edition = "2024"
license = "Apache-2.0"
version = "0.1.0"
description = "Host library for MCU-Link probes running Verge firmware"

[dependencies]
csv = "1.4.0"
dirs = "7.0.0"
escapement-tickwave-format = { version = "0.1.0", git = "https://github.com/Escapement-Project/tickwave", tag = "v0.1.0", optional = true }
escapement-tickwave-view = { version = "0.1.0", git = "https://github.com/Escapement-Project/tickwave", tag = "v0.1.0", optional = true }
hex = "0.4.3"
hidapi = "2.6.7"
humantime = "2.4.0"
minisign = { version = "0.10.0", optional = true }
minisign-verify = "0.3.0"
nusb = "0.2.9"
object = { version = "0.40.0", default-features = false, features = ["read_core", "elf", "std"] }
probe-rs = { version = "0.32.0", git = "https://github.com/CordlessCoder/probe-rs", rev = "fc3d3095f3f05c18c366e00ac180646f87aed786", default-features = false, features = ["builtin-targets", "builtin-formats", "coredump"] }
rblhost = "0.2.0"
same-file = "1.0.6"
semver = "1.0.28"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
srec = "0.2.0"
tempfile = "3.27.0"
thiserror = "2.0.21"
tracing = "0.1.44"
ureq = "3.5.1"
zip = { version = "9.3.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
enum_glob_use = "deny"

[features]
# Energy captures as tickwave recordings (`tickwave`).
tickwave = ["dep:escapement-tickwave-format", "dep:escapement-tickwave-view"]
simulate = ["dep:minisign"]

[dev-dependencies]
clap = { version = "4.6.7", features = ["derive"] }
escapement-verge-probe = { path = ".", features = ["simulate"] }

[target."cfg(unix)".dependencies]
nix = { version = "0.32.0", default-features = false, features = ["signal"] }
